version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Dependencies are pinned exactly; "increase" keeps them pinned and moves the exact version.
    versioning-strategy: increase
    # Same rule as T-101: no release younger than two weeks.
    cooldown:
      default-days: 14
    # TypeScript 7 is not supported by typescript-eslint (via eslint-config-next) and has no compiler API for Next's type check. See F-44.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
