version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Dependencies are pinned exactly; "increase" keeps them pinned and moves the exact version.
    versioning-strategy: increase
    # Same rule as T-101: no release younger than two weeks.
    cooldown:
      default-days: 14
    # TypeScript 7 is not supported by typescript-eslint (via eslint-config-next) and has no compiler API for Next's type check. See F-44.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # msw 3: vitest 5 declares an optional peer msw ^2.4.9, and npm 10 (Node 22) cannot install msw 3 beside it. See F-43, F-45.
      - dependency-name: msw
        update-types: ["version-update:semver-major"]
      # ESLint 10: eslint-plugin-react, -import and -jsx-a11y (via eslint-config-next) only declare support up to ESLint 9. See F-43, F-45.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
